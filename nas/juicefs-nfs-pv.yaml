apiVersion: v1
kind: PersistentVolume
metadata:
  name: juicefs-nfs-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=4
  nfs:
    server: 10.43.53.202
    path: /jfs