<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>网格世界 Q-Learning 可视化</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #F1EFE8;
    color: #2C2C2A;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { max-width: 680px; width: 100%; }
  button {
    height: 36px;
    padding: 0 14px;
    border-radius: 8px;
    border: 0.5px solid #B4B2A9;
    background: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #F1EFE8; }
  button:active { transform: scale(0.98); }
  input[type=range] { accent-color: #5F5E5A; }
  .card { background: #FFFFFF; border-radius: 8px; padding: 1rem; }
  .muted { color: #5F5E5A; font-size: 13px; margin: 0 0 4px; }
  .big { font-size: 24px; font-weight: 500; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
<h2 style="font-weight:500;">网格世界 Q-Learning 可视化</h2>

<div style="display:flex;flex-direction:column;gap:1rem;">
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
  <button id="stepBtn">走一步</button>
  <button id="episodeBtn">跑完这一局</button>
  <button id="runBtn">连续训练 100 局</button>
  <button id="resetBtn">重置</button>
  <button id="pathBtn">标注最优路径 ⭐</button>
  <label style="font-size:13px;color:#5F5E5A;display:flex;align-items:center;gap:6px;">速度
    <input type="range" id="speed" min="10" max="400" value="120" step="10" style="width:100px;">
  </label>
</div>

<div style="display:flex;gap:20px;flex-wrap:wrap;">
  <div>
    <div id="grid" style="display:grid;grid-template-columns:repeat(4,64px);grid-template-rows:repeat(4,64px);gap:4px;"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;min-width:160px;">
    <div class="card">
      <p class="muted">当前局数</p>
      <p class="big" id="epOut">0 / 100</p>
    </div>
    <div class="card">
      <p class="muted">这一局步数</p>
      <p class="big" id="stepOut">0</p>
    </div>
    <div class="card">
      <p class="muted">状态</p>
      <p style="font-size:14px;margin:0;" id="statusOut">未开始</p>
    </div>
  </div>
</div>
<p style="font-size:12px;color:#898781;margin:0;">格子颜色深浅代表该格子学到的最高价值（Q值），箭头代表当前认为最好的方向。深色代表该方向的路走得通、离终点近。</p>
</div>
</div>

<script>
(function(){
const SIZE=4;
const GOAL=[3,3];
const OBST=[[1,1],[1,3],[3,0]];
const ACTS=[[-1,0],[1,0],[0,-1],[0,1]]; // 上 下 左 右
const ARROWS=['\u2191','\u2193','\u2190','\u2192'];
const EPS=0.9, ALPHA=0.1, GAMMA=0.9, MAXSTEPS=100, MAXEP=100;

let Q, state, ep, stepCount, running=false;
let optimalPath=[]; // 存放标注为最优路径的格子坐标

function isObst(r,c){return OBST.some(o=>o[0]===r&&o[1]===c);}
function inBounds(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE;}
function keyOf(r,c){return r+'_'+c;}

function initQ(){
  Q={};
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) Q[keyOf(r,c)]=[0,0,0,0];
}

function reset(){
  initQ(); state=[0,0]; ep=0; stepCount=0; running=false; optimalPath=[];
  document.getElementById('epOut').textContent='0 / '+MAXEP;
  document.getElementById('stepOut').textContent='0';
  document.getElementById('statusOut').textContent='未开始';
  render();
}

function chooseAction(r,c){
  if(Math.random()>EPS) return Math.floor(Math.random()*4);
  const q=Q[keyOf(r,c)];
  let best=0;
  for(let i=1;i<4;i++) if(q[i]>q[best]) best=i;
  return best;
}

function envStep(r,c,a){
  const nr=r+ACTS[a][0], nc=c+ACTS[a][1];
  if(!inBounds(nr,nc)||isObst(nr,nc)) return {next:[r,c],reward:-1};
  if(nr===GOAL[0]&&nc===GOAL[1]) return {next:[nr,nc],reward:10};
  return {next:[nr,nc],reward:-0.1};
}

function doStep(){
  const [r,c]=state;
  if(r===GOAL[0]&&c===GOAL[1]) return false;
  const a=chooseAction(r,c);
  const {next,reward}=envStep(r,c,a);
  const oldV=Q[keyOf(r,c)][a];
  const nextMax=Math.max(...Q[keyOf(next[0],next[1])]);
  const newV=oldV+ALPHA*(reward+GAMMA*nextMax-oldV);
  Q[keyOf(r,c)][a]=newV;
  state=next;
  stepCount++;
  document.getElementById('stepOut').textContent=stepCount;
  render();
  if((state[0]===GOAL[0]&&state[1]===GOAL[1])||stepCount>=MAXSTEPS){
    return false;
  }
  return true;
}

function finishEpisode(cb){
  const speed=+document.getElementById('speed').value;
  function loop(){
    if(!doStep()){ if(cb) cb(); return; }
    setTimeout(loop,speed);
  }
  loop();
}

function newEpisode(){
  state=[0,0]; stepCount=0; ep++;
  document.getElementById('epOut').textContent=ep+' / '+MAXEP;
  document.getElementById('stepOut').textContent='0';
}

function computeOptimalPath(){
  // 从起点出发，每一步都选Q值最高的方向（不再探索），一路走到终点
  // 这叫"贪心执行"：训练时会随机探索，但验证成果时只看"当前最优选择"
  let r=0,c=0;
  const path=[[r,c]];
  const visited=new Set([keyOf(r,c)]);
  let guard=0;
  while(!(r===GOAL[0]&&c===GOAL[1]) && guard<SIZE*SIZE+2){
    const q=Q[keyOf(r,c)];
    let best=0; for(let i=1;i<4;i++) if(q[i]>q[best]) best=i;
    const nr=r+ACTS[best][0], nc=c+ACTS[best][1];
    if(!inBounds(nr,nc)||isObst(nr,nc)) break; // 训练不充分，走不通就停下
    r=nr; c=nc;
    if(visited.has(keyOf(r,c))) break; // 出现循环，说明还没学好
    visited.add(keyOf(r,c));
    path.push([r,c]);
    guard++;
  }
  optimalPath=path;
  render();
  const reached = r===GOAL[0]&&c===GOAL[1];
  document.getElementById('statusOut').textContent = reached
    ? '已标出最优路径，共'+(path.length-1)+'步'
    : '训练还不充分，路径未能走到终点，建议多训练几轮';
}

function render(){
  const gridEl=document.getElementById('grid');
  gridEl.innerHTML='';
  let maxQ=0.0001;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const m=Math.max(...Q[keyOf(r,c)]);
    if(m>maxQ) maxQ=m;
  }
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell=document.createElement('div');
      const isAgent = state && state[0]===r && state[1]===c;
      const isGoal = r===GOAL[0]&&c===GOAL[1];
      const isOb = isObst(r,c);
      cell.style.width='64px';
      cell.style.height='64px';
      cell.style.borderRadius='6px';
      cell.style.display='flex';
      cell.style.alignItems='center';
      cell.style.justifyContent='center';
      cell.style.position='relative';
      cell.style.fontSize='13px';
      cell.style.border='0.5px solid #D3D1C7';
      if(isOb){
        cell.style.background='#5F5E5A';
        cell.innerHTML='<i class="ti ti-x" style="font-size:18px;color:#FFFFFF"></i>';
      } else if(isGoal){
        cell.style.background='#5DCAA5';
        cell.innerHTML='<i class="ti ti-flag" style="font-size:18px;color:#04342C"></i>';
      } else {
        const q=Q[keyOf(r,c)];
        const m=Math.max(...q);
        const t=Math.max(0,Math.min(1,m/maxQ));
        const alpha=0.08+t*0.35;
        cell.style.background='rgba(29,158,117,'+alpha.toFixed(2)+')';
        let best=0; for(let i=1;i<4;i++) if(q[i]>q[best]) best=i;
        if(m>0.001){
          const arrow=document.createElement('span');
          arrow.textContent=ARROWS[best];
          arrow.style.color='#5F5E5A';
          arrow.style.fontSize='20px';
          cell.appendChild(arrow);
        }
      }
      const onPath = optimalPath.some(p=>p[0]===r&&p[1]===c);
      if(onPath){
        const star=document.createElement('span');
        star.textContent='\u2b50';
        star.style.position='absolute';
        star.style.top='2px';
        star.style.right='2px';
        star.style.fontSize='13px';
        cell.appendChild(star);
      }
      if(isAgent){
        const dot=document.createElement('div');
        dot.style.position='absolute';
        dot.style.width='16px';
        dot.style.height='16px';
        dot.style.borderRadius='50%';
        dot.style.background='#D85A30';
        cell.appendChild(dot);
      }
      gridEl.appendChild(cell);
    }
  }
}

document.getElementById('stepBtn').onclick=function(){
  if(running) return;
  document.getElementById('statusOut').textContent='单步执行中';
  if(state[0]===GOAL[0]&&state[1]===GOAL[1]) newEpisode();
  doStep();
  document.getElementById('statusOut').textContent='已暂停';
};

document.getElementById('episodeBtn').onclick=function(){
  if(running) return;
  running=true;
  document.getElementById('statusOut').textContent='跑这一局中';
  if(state[0]===GOAL[0]&&state[1]===GOAL[1]) newEpisode();
  finishEpisode(function(){ running=false; document.getElementById('statusOut').textContent='这一局结束'; });
};

document.getElementById('runBtn').onclick=function(){
  if(running) return;
  running=true;
  document.getElementById('statusOut').textContent='连续训练中';
  function loop(){
    if(ep>=MAXEP){ running=false; document.getElementById('statusOut').textContent='训练完成'; return; }
    newEpisode();
    finishEpisode(function(){
      if(ep>=MAXEP){ running=false; document.getElementById('statusOut').textContent='训练完成'; return; }
      loop();
    });
  }
  loop();
};

document.getElementById('pathBtn').onclick=computeOptimalPath;

document.getElementById('resetBtn').onclick=reset;

reset();
})();
</script>
</body>
</html>
