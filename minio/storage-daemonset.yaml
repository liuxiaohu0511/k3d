# storage-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-storage-agent
  namespace: storage-test
spec:
  selector:
    matchLabels:
      app: local-storage-agent
  template:
    metadata:
      labels:
        app: local-storage-agent
    spec:
      containers:
        - name: storage-agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: host-data
              mountPath: /data     # 容器内看到的路径
      volumes:
        - name: host-data
          hostPath:
            path: /mnt/host-data   # 节点（容器）上的真实路径
            type: DirectoryOrCreate  # 目录不存在就自动创建